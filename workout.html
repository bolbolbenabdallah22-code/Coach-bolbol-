<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Workout | Coach Bolbol</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .workout-hero {
      background: linear-gradient(135deg, #111827, #374151);
      color: #fff;
      border-radius: 24px;
      padding: 25px 20px;
      margin-bottom: 18px;
    }

    .workout-hero h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    .workout-hero p {
      margin: 0;
      opacity: .78;
    }

    .timer-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(15,23,42,.05);
    }

    .timer-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .timer-value {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .timer-actions {
      display: flex;
      gap: 9px;
    }

    .timer-actions button {
      flex: 1;
    }

    .exercise-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(15,23,42,.04);
    }

    .exercise-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .exercise-head h2 {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .exercise-meta {
      color: #6b7280;
      font-size: 13px;
    }

    .exercise-number {
      min-width: 35px;
      height: 35px;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .set-list {
      display: grid;
      gap: 9px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 42px 1fr 1fr 1fr;
      gap: 7px;
      align-items: center;
    }

    .set-number {
      height: 42px;
      border-radius: 11px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .set-input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      height: 42px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      padding: 0 9px;
      font-size: 14px;
      outline: none;
    }

    .set-input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17,24,39,.07);
    }

    .set-complete {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      border-radius: 11px;
      background: #f3f4f6;
      cursor: pointer;
    }

    .set-complete input {
      width: 18px;
      height: 18px;
    }

    .workout-summary {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 20px;
      margin: 18px 0 30px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .summary-stat {
      background: #f8fafc;
      border-radius: 15px;
      padding: 13px;
    }

    .summary-stat small {
      display: block;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .summary-stat strong {
      font-size: 19px;
    }

    .empty-workout {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      color: #6b7280;
    }

    .rest-box {
      margin-top: 13px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 13px;
      color: #4b5563;
      font-size: 13px;
    }

    @media (min-width: 700px) {
      .workout-page {
        max-width: 850px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

<header class="app-header">
  <div class="header-inner">

    <button
      class="icon-button"
      onclick="goBack()"
      aria-label="Go back">
      ←
    </button>

    <div class="header-title">
      <strong>Workout</strong>
    </div>

    <a
      href="dashboard.html"
      class="header-action">
      Home
    </a>

  </div>
</header>

<main class="page-container workout-page">

  <section class="workout-hero">

    <h1 id="workoutTitle">
      Today's Workout
    </h1>

    <p id="workoutSubtitle">
      Record your sets and track your performance.
    </p>

  </section>

  <section class="timer-card">

    <div class="timer-label">
      Workout duration
    </div>

    <div
      id="timer"
      class="timer-value">
      00:00
    </div>

    <div class="timer-actions">

      <button
        id="timerButton"
        class="btn btn-primary"
        onclick="toggleTimer()">
        Start
      </button>

      <button
        class="btn btn-secondary"
        onclick="resetTimer()">
        Reset
      </button>

    </div>

  </section>

  <section id="exerciseContainer"></section>

  <section
    id="workoutSummary"
    class="workout-summary"
    style="display:none;">

    <h2>Workout Summary</h2>

    <div class="summary-grid">

      <div class="summary-stat">
        <small>Duration</small>
        <strong id="summaryDuration">0 min</strong>
      </div>

      <div class="summary-stat">
        <small>Exercises</small>
        <strong id="summaryExercises">0</strong>
      </div>

      <div class="summary-stat">
        <small>Total Volume</small>
        <strong id="summaryVolume">0 kg</strong>
      </div>

      <div class="summary-stat">
        <small>Completed Sets</small>
        <strong id="summarySets">0</strong>
      </div>

    </div>

  </section>

  <div style="margin-bottom:35px;">

    <button
      id="finishButton"
      class="btn btn-primary btn-block"
      onclick="finishCurrentWorkout()">
      Finish Workout
    </button>

  </div>

</main>

<nav class="bottom-nav">

  <a
    href="dashboard.html"
    data-page="dashboard">
    <span>⌂</span>
    <small>Home</small>
  </a>

  <a
    href="programs.html"
    data-page="programs">
    <span>▣</span>
    <small>Programs</small>
  </a>

  <a
    href="nutrition.html"
    data-page="nutrition">
    <span>◉</span>
    <small>Nutrition</small>
  </a>

  <a
    href="progress.html"
    data-page="progress">
    <span>↗</span>
    <small>Progress</small>
  </a>

  <a
    href="profile.html"
    data-page="profile">
    <span>●</span>
    <small>Profile</small>
  </a>

</nav>

<script src="app.js"></script>
<script src="storage.js"></script>
<script src="programs.js"></script>
<script src="exercises.js"></script>
<script src="workout.js"></script>
<script src="ui.js"></script>

<script>

  let activeWorkout = null;
  let timerSeconds = 0;
  let timerInterval = null;
  let timerRunning = false;

  function loadWorkout() {

    const raw =
      localStorage.getItem(
        "coach_bolbol_active_workout"
      );

    if (raw) {

      try {
        activeWorkout = JSON.parse(raw);
      } catch (error) {
        console.error(error);
        activeWorkout = null;
      }
    }

    if (!activeWorkout) {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const program =
        params.get("program") ||
        "strength";

      const level =
        params.get("level") ||
        "beginner";

      createWorkoutFromProgram(
        program,
        level
      );
    }

    renderWorkout();
  }

  function createWorkoutFromProgram(
    programId,
    level
  ) {

    if (
      !window.CoachBolbolPrograms ||
      typeof CoachBolbolPrograms.getProgram !==
      "function"
    ) {
      activeWorkout = {
        title: "Workout",
        exercises: []
      };

      return;
    }

    const program =
      CoachBolbolPrograms.getProgram(
        programId,
        level
      );

    if (!program) {

      activeWorkout = {
        title: "Workout",
        exercises: []
      };

      return;
    }

    const days =
      Array.isArray(program.days)
        ? program.days
        : [];

    if (!days.length) {

      activeWorkout = {
        title: program.name || "Workout",
        exercises: []
      };

      return;
    }

    const dayIndex =
      new Date().getDay() % days.length;

    const day =
      days[dayIndex] || days[0];

    activeWorkout = {
      title:
        day.name ||
        day.title ||
        program.name ||
        "Workout",

      program:
        programId,

      level,

      date:
        new Date().toISOString(),

      exercises:
        Array.isArray(day.exercises)
          ? day.exercises
          : []
    };

    saveActiveWorkout();
  }

  function saveActiveWorkout() {

    if (!activeWorkout) {
      return;
    }

    localStorage.setItem(
      "coach_bolbol_active_workout",
      JSON.stringify(activeWorkout)
    );
  }

  function renderWorkout() {

    if (!activeWorkout) {
      return;
    }

    document.getElementById(
      "workoutTitle"
    ).textContent =
      activeWorkout.title ||
      "Today's Workout";

    document.getElementById(
      "workoutSubtitle"
    ).textContent =
      activeWorkout.program
        ? `${capitalize(activeWorkout.program)} training`
        : "Record your sets and track your performance.";

    const container =
      document.getElementById(
        "exerciseContainer"
      );

    const exercises =
      Array.isArray(activeWorkout.exercises)
        ? activeWorkout.exercises
        : [];

    if (!exercises.length) {

      container.innerHTML = `
        <div class="empty-workout">

          <h2>No exercises found</h2>

          <p>
            Select a training program first,
            then start a workout.
          </p>

          <a
            href="programs.html"
            class="btn btn-primary">
            View Programs
          </a>

        </div>
      `;

      return;
    }

    container.innerHTML =
      exercises.map(
        (exercise, exerciseIndex) => {

          const name =
            exercise.name ||
            exercise.exercise ||
            exercise.id ||
            `Exercise ${exerciseIndex + 1}`;

          const sets =
            Number(exercise.sets) ||
            Number(exercise.rounds) ||
            3;

          const reps =
            exercise.reps ??
            "8-12";

          const rest =
            exercise.rest ??
            "60-120 sec";

          const rows =
            Array.from(
              { length: sets },
              (_, setIndex) => {

                return `
                  <div class="set-row">

                    <div class="set-number">
                      ${setIndex + 1}
                    </div>

                    <input
                      class="set-input"
                      type="number"
                      min="0"
                      step="0.5"
                      placeholder="kg"
                      data-exercise="${exerciseIndex}"
                      data-set="${setIndex}"
                      data-field="weight">

                    <input
                      class="set-input"
                      type="number"
                      min="0"
                      step="1"
                      placeholder="reps"
                      value="${getDefaultReps(reps)}"
                      data-exercise="${exerciseIndex}"
                      data-set="${setIndex}"
                      data-field="reps">

                    <label class="set-complete">
                      <input
                        type="checkbox"
                        data-exercise="${exerciseIndex}"
                        data-set="${setIndex}"
                        data-field="completed">
                    </label>

                  </div>
                `;
              }
            ).join("");

          return `
            <article class="exercise-card">

              <div class="exercise-head">

                <div>

                  <h2>
                    ${escapeHTML(name)}
                  </h2>

                  <div class="exercise-meta">
                    ${sets} sets ·
                    ${escapeHTML(String(reps))} reps
                  </div>

                </div>

                <div class="exercise-number">
                  ${exerciseIndex + 1}
                </div>

              </div>

              <div class="set-list">

                ${rows}

              </div>

              <div class="rest-box">
                Rest: ${escapeHTML(String(rest))}
              </div>

            </article>
          `;

        }
      ).join("");
  }

  function getDefaultReps(reps) {

    if (typeof reps === "number") {
      return reps;
    }

    const match =
      String(reps).match(/\d+/);

    return match
      ? match[0]
      : "";
  }

  function toggleTimer() {

    if (timerRunning) {

      stopTimer();

    } else {

      startTimer();

    }
  }

  function startTimer() {

    timerRunning = true;

    document.getElementById(
      "timerButton"
    ).textContent = "Pause";

    if (timerInterval) {
      return;
    }

    timerInterval =
      setInterval(() => {

        timerSeconds++;

        updateTimer();

      }, 1000);
  }

  function stopTimer() {

    timerRunning = false;

    document.getElementById(
      "timerButton"
    ).textContent = "Start";

    clearInterval(timerInterval);

    timerInterval = null;
  }

  function resetTimer() {

    stopTimer();

    timerSeconds = 0;

    updateTimer();
  }

  function updateTimer() {

    const minutes =
      Math.floor(timerSeconds / 60);

    const seconds =
      timerSeconds % 60;

    document.getElementById(
      "timer"
    ).textContent =
      `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
  }

  function collectSets() {

    const setRows =
      document.querySelectorAll(
        ".set-row"
      );

    const exercises = {};

    setRows.forEach(row => {

      const weightInput =
        row.querySelector(
          '[data-field="weight"]'
        );

      const repsInput =
        row.querySelector(
          '[data-field="reps"]'
        );

      const completedInput =
        row.querySelector(
          '[data-field="completed"]'
        );

      const exerciseIndex =
        Number(
          weightInput?.dataset.exercise
        );

      const setIndex =
        Number(
          weightInput?.dataset.set
        );

      if (!exercises[exerciseIndex]) {
        exercises[exerciseIndex] = [];
      }

      exercises[exerciseIndex].push({
        set: setIndex + 1,

        weight:
          Number(weightInput?.value) || 0,

        reps:
          Number(repsInput?.value) || 0,

        completed:
          Boolean(completedInput?.checked)
      });

    });

    return exercises;
  }

  function calculateWorkoutStats() {

    const sets =
      collectSets();

    let totalVolume = 0;
    let completedSets = 0;

    Object.values(sets).forEach(
      exerciseSets => {

        exerciseSets.forEach(set => {

          if (set.completed) {
            completedSets++;
          }

          totalVolume +=
            set.weight * set.reps;

        });

      }
    );

    return {
      totalVolume,
      completedSets,
      exerciseCount:
        Object.keys(sets).length
    };
  }

  function finishCurrentWorkout() {

    if (!activeWorkout) {
      return;
    }

    stopTimer();

    const stats =
      calculateWorkoutStats();

    const completedWorkout = {

      ...activeWorkout,

      finishedAt:
        new Date().toISOString(),

      durationSeconds:
        timerSeconds,

      durationMinutes:
        Math.round(timerSeconds / 60),

      totalVolume:
        stats.totalVolume,

      completedSets:
        stats.completedSets,

      exerciseCount:
        stats.exerciseCount,

      sets:
        collectSets()

    };

    try {

      if (
        window.CoachBolbolWorkout &&
        typeof CoachBolbolWorkout.finishWorkout ===
        "function"
      ) {

        CoachBolbolWorkout.finishWorkout(
          completedWorkout
        );

      } else {

        const history =
          JSON.parse(
            localStorage.getItem(
              "coach_bolbol_workouts"
            ) || "[]"
          );

        history.push(
          completedWorkout
        );

        localStorage.setItem(
          "coach_bolbol_workouts",
          JSON.stringify(history)
        );
      }

    } catch (error) {

      console.error(error);

      if (window.CoachBolbolUI) {
        CoachBolbolUI.toast(
          "Workout could not be saved.",
          "error"
        );
      }

      return;
    }

    showSummary(
      completedWorkout
    );

    localStorage.removeItem(
      "coach_bolbol_active_workout"
    );

    if (window.CoachBolbolUI) {

      CoachBolbolUI.toast(
        "Workout completed and saved.",
        "success"
      );

    }

    document.getElementById(
      "finishButton"
    ).textContent =
      "Workout Completed";

    document.getElementById(
      "finishButton"
    ).disabled = true;
  }

  function showSummary(workout) {

    document.getElementById(
      "workoutSummary"
    ).style.display = "block";

    document.getElementById(
      "summaryDuration"
    ).textContent =
      `${workout.durationMinutes || 0} min`;

    document.getElementById(
      "summaryExercises"
    ).textContent =
      workout.exerciseCount || 0;

    document.getElementById(
      "summaryVolume"
    ).textContent =
      `${Math.round(workout.totalVolume || 0)} kg`;

    document.getElementById(
      "summarySets"
    ).textContent =
      workout.completedSets || 0;

    document
      .getElementById("workoutSummary")
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
  }

  function capitalize(value) {

    if (!value) {
      return "";
    }

    return String(value)
      .charAt(0)
      .toUpperCase() +
      String(value).slice(1);
  }

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      if (
        window.CoachBolbolUI &&
        typeof CoachBolbolUI.setActiveNav ===
        "function"
      ) {
        CoachBolbolUI.setActiveNav("workout");
      }

      loadWorkout();

    }
  );

</script>

</body>
  </html>
