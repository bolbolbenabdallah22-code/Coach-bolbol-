<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f7f9fc"
  >

  <title>Coach Bolbol — Login</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f9fc;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.08);
      animation: authEnter .45s ease;
    }

    @keyframes authEnter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #ffffff;
      font-size: 30px;
      font-weight: 800;
    }

    .auth-brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .auth-brand p {
      margin: 8px 0 0;
      color: #6b7280;
    }

    .auth-field {
      margin-bottom: 17px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    .auth-field input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #dfe3ea;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
    }

    .auth-field input:focus {
      border-color: #111827;
    }

    .auth-button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      background: #111827;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .auth-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      background: #fff1f2;
      color: #be123c;
    }

    .auth-message.success {
      background: #ecfdf5;
      color: #047857;
    }

    .auth-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .auth-links a {
      color: #111827;
      font-weight: 800;
      text-decoration: none;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 7px;
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
    }

  </style>

</head>


<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-brand">

        <div class="auth-logo">
          CB
        </div>

        <h1>Coach Bolbol</h1>

        <p>
          Your fitness journey starts here.
        </p>

      </div>


      <form id="loginForm">

        <div class="auth-field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="auth-field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <a
            href="#"
            class="forgot"
            id="forgotPassword"
          >
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="auth-button"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <div
        id="authMessage"
        class="auth-message"
      ></div>


      <div class="auth-links">

        Don't have an account?

        <a href="register.html">
          Create account
        </a>

      </div>

    </section>

  </main>


  <!-- =====================================================
       SUPABASE LIBRARY
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       COACH BOLBOL FILES
       ===================================================== -->

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="auth.js"></script>


  <script>

    const form =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("authMessage");

    const forgot =
      document.getElementById("forgotPassword");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "auth-message show " + type;

    }


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          showMessage(
            "Please enter your email and password.",
            "error"
          );

          return;

        }


        button.disabled = true;

        button.textContent =
          "Logging in...";


        const result =
          await window.CoachBolbolAuth.login(
            email,
            password
          );


        if (!result.success) {

          showMessage(
            result.error ||
            "Login failed.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Login";

          return;

        }


        showMessage(
          "Login successful. Opening your dashboard...",
          "success"
        );


        setTimeout(function () {

          window.location.href =
            "dashboard.html";

        }, 700);

      }
    );


    forgot.addEventListener(
      "click",
      async function (event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Enter your email first.",
            "error"
          );

          emailInput.focus();

          return;

        }


        const result =
          await window.CoachBolbolAuth
            .resetPassword(email);


        if (!result.success) {

          showMessage(
            result.error ||
            "Could not send reset email.",
            "error"
          );

          return;

        }


        showMessage(
          "Password reset email sent.",
          "success"
        );

      }
    );


    /* =====================================================
       CHECK EXISTING SESSION
       ===================================================== */

    (async function () {

      const session =
        await window.CoachBolbolAuth.getSession();


      if (session) {

        window.location.href =
          "dashboard.html";

      }

    })();

  </script>

</body>

  </html>
