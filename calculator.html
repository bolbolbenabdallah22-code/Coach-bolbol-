<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculator | Coach Bolbol</title>

  <meta name="theme-color" content="#f7f8fa">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="container header-inner">

      <a href="dashboard.html" class="brand">
        <div class="brand-mark">CB</div>

        <div class="brand-text">
          <strong>Coach Bolbol</strong>
          <span>Scientific Calculator</span>
        </div>
      </a>

      <a href="dashboard.html" class="back-link">
        ← Dashboard
      </a>

    </div>
  </header>


  <!-- MAIN -->
  <main>

    <section class="page-section">

      <div class="container">

        <!-- TITLE -->
        <div class="page-heading">

          <span class="eyebrow">
            SCIENTIFIC FITNESS CALCULATOR
          </span>

          <h1>
            Know Your Numbers
          </h1>

          <p>
            Estimate your BMR, TDEE, BMI, calorie target
            and daily macronutrients.
          </p>

        </div>


        <!-- CALCULATOR -->
        <section class="dashboard-card">

          <form id="calculatorForm">

            <div class="form-section">

              <div class="form-section-title">

                <span class="eyebrow">
                  PERSONAL DATA
                </span>

                <h3>
                  Your Measurements
                </h3>

              </div>


              <div class="form-grid">

                <div class="form-group">

                  <label for="age">
                    Age
                  </label>

                  <input
                    type="number"
                    id="age"
                    min="13"
                    max="100"
                    placeholder="23"
                    required
                  >

                </div>


                <div class="form-group">

                  <label for="gender">
                    Gender
                  </label>

                  <select id="gender">

                    <option value="male">
                      Male
                    </option>

                    <option value="female">
                      Female
                    </option>

                  </select>

                </div>


                <div class="form-group">

                  <label for="height">
                    Height
                  </label>

                  <div class="input-with-unit">

                    <input
                      type="number"
                      id="height"
                      min="100"
                      max="250"
                      step="0.1"
                      placeholder="183"
                      required
                    >

                    <span>cm</span>

                  </div>

                </div>


                <div class="form-group">

                  <label for="weight">
                    Weight
                  </label>

                  <div class="input-with-unit">

                    <input
                      type="number"
                      id="weight"
                      min="30"
                      max="300"
                      step="0.1"
                      placeholder="90"
                      required
                    >

                    <span>kg</span>

                  </div>

                </div>


                <div class="form-group form-group-full">

                  <label for="activity">
                    Activity Level
                  </label>

                  <select id="activity">

                    <option value="1.2">
                      Sedentary — little or no exercise
                    </option>

                    <option value="1.375">
                      Lightly Active — 1–3 days/week
                    </option>

                    <option value="1.55">
                      Moderately Active — 3–5 days/week
                    </option>

                    <option value="1.725">
                      Very Active — 6–7 days/week
                    </option>

                    <option value="1.9">
                      Extremely Active — hard training / physical job
                    </option>

                  </select>

                </div>

              </div>

            </div>


            <!-- GOAL -->
            <div class="form-section">

              <div class="form-section-title">

                <span class="eyebrow">
                  YOUR GOAL
                </span>

                <h3>
                  Choose Your Target
                </h3>

              </div>


              <div class="goal-selector">

                <label class="goal-option">

                  <input
                    type="radio"
                    name="goal"
                    value="loss"
                    checked
                  >

                  <span>
                    <strong>Fat Loss</strong>
                    <small>
                      Moderate calorie deficit
                    </small>
                  </span>

                </label>


                <label class="goal-option">

                  <input
                    type="radio"
                    name="goal"
                    value="maintenance"
                  >

                  <span>
                    <strong>Maintenance</strong>
                    <small>
                      Maintain current weight
                    </small>
                  </span>

                </label>


                <label class="goal-option">

                  <input
                    type="radio"
                    name="goal"
                    value="gain"
                  >

                  <span>
                    <strong>Muscle Gain</strong>
                    <small>
                      Controlled calorie surplus
                    </small>
                  </span>

                </label>

              </div>

            </
