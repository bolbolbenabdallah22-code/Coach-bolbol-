<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f7f9fc"
  >

  <title>Coach Bolbol — Create Account</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f9fc;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,.08);
      animation: authEnter .45s ease;
    }

    @keyframes authEnter {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .auth-brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
    }

    .auth-brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .auth-brand p {
      margin: 8px 0 0;
      color: #6b7280;
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    .password-wrap {
      position: relative;
    }

    .auth-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      padding-right: 70px;
      border: 1px solid #dfe3ea;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .auth-field input:focus {
      border-color: #111827;
    }

    .auth-field input.valid {
      border-color: #16a34a;
    }

    .auth-field input.invalid {
      border-color: #dc2626;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px;
    }

    .password-hint {
      margin-top: 6px;
      color: #6b7280;
      font-size: 12px;
    }

    .password-status {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .password-status.match {
      color: #16a34a;
    }

    .password-status.no-match {
      color: #dc2626;
    }

    .auth-button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .auth-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      background: #fff1f2;
      color: #be123c;
    }

    .auth-message.success {
      background: #ecfdf5;
      color: #047857;
    }

    .auth-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .auth-links a {
      color: #111827;
      font-weight: 800;
      text-decoration: none;
    }

  </style>

</head>


<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-brand">

        <div class="auth-logo">
          CB
        </div>

        <h1>
          Coach Bolbol
        </h1>

        <p>
          Create your fitness account.
        </p>

      </div>


      <form
        id="registerForm"
        novalidate
      >

        <!-- FULL NAME -->

        <div class="auth-field">

          <label for="fullName">
            Full name
          </label>

          <input
            id="fullName"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="auth-field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="auth-field">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('password', this)"
            >
              Show
            </button>

          </div>

          <div class="password-hint">
            Minimum 6 characters.
          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="auth-field">

          <label for="confirmPassword">
            Confirm password
          </label>

          <div class="password-wrap">

            <input
              id="confirmPassword"
              type="password"
              placeholder="Repeat your password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('confirmPassword', this)"
            >
              Show
            </button>

          </div>

          <div
            id="passwordStatus"
            class="password-status"
          ></div>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="auth-button"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <!-- MESSAGE -->

      <div
        id="authMessage"
        class="auth-message"
      ></div>


      <!-- LOGIN -->

      <div class="auth-links">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- COACH BOLBOL -->

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="auth.js"></script>


  <script>

    const form =
      document.getElementById("registerForm");

    const nameInput =
      document.getElementById("fullName");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmInput =
      document.getElementById("confirmPassword");

    const passwordStatus =
      document.getElementById("passwordStatus");

    const button =
      document.getElementById("registerButton");

    const message =
      document.getElementById("authMessage");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "auth-message show " + type;

    }


    /* =========================
       PASSWORD VISIBILITY
    ========================= */

    function togglePassword(id, buttonElement) {

      const input =
        document.getElementById(id);

      if (input.type === "password") {

        input.type = "text";

        buttonElement.textContent =
          "Hide";

      } else {

        input.type = "password";

        buttonElement.textContent =
          "Show";

      }

    }


    /* =========================
       PASSWORD MATCH
    ========================= */

    function checkPasswords() {

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmInput.value;


      if (!confirmPassword) {

        passwordStatus.textContent = "";

        passwordStatus.className =
          "password-status";

        confirmInput.classList.remove(
          "valid",
          "invalid"
        );

        return false;

      }


      if (password === confirmPassword) {

        passwordStatus.textContent =
          "✓ Passwords match";

        passwordStatus.className =
          "password-status match";

        confirmInput.classList.remove(
          "invalid"
        );

        confirmInput.classList.add(
          "valid"
        );

        return true;

      }


      passwordStatus.textContent =
        "✕ Passwords do not match";

      passwordStatus.className =
        "password-status no-match";

      confirmInput.classList.remove(
        "valid"
      );

      confirmInput.classList.add(
        "invalid"
      );

      return false;

    }


    passwordInput.addEventListener(
      "input",
      checkPasswords
    );

    confirmInput.addEventListener(
      "input",
      checkPasswords
    );


    /* =========================
       REGISTER
    ========================= */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const fullName =
          nameInput.value.trim();

        const email =
          emailInput.value.trim();

        /*
         * IMPORTANT:
         * Do NOT trim passwords.
         * Spaces can technically be part
         * of a password.
         */

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmInput.value;


        /* NAME */

        if (!fullName) {

          showMessage(
            "Please enter your full name.",
            "error"
          );

          nameInput.focus();

          return;

        }


        /* EMAIL */

        if (!email) {

          showMessage(
            "Please enter your email.",
            "error"
          );

          emailInput.focus();

          return;

        }


        /* PASSWORD LENGTH */

        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          passwordInput.focus();

          return;

        }


        /* PASSWORD MATCH */

        if (password !== confirmPassword) {

          checkPasswords();

          showMessage(
            "Please enter the same password in both fields.",
            "error"
          );

          confirmInput.focus();

          return;

        }


        /* SUPABASE CHECK */

        if (
          !window.CoachBolbolAuth ||
          typeof window.CoachBolbolAuth.signUp !== "function"
        ) {

          showMessage(
            "Authentication is not configured yet.",
            "error"
          );

          return;

        }


        /* LOADING */

        button.disabled = true;

        button.textContent =
          "Creating account...";


        try {

          const result =
            await window.CoachBolbolAuth.signUp(
              email,
              password,
              fullName
            );


          /* ERROR */

          if (
            !result ||
            !result.success
          ) {

            showMessage(
              result?.error ||
              "Account creation failed. Please try again.",
              "error"
            );

            button.disabled = false;

            button.textContent =
              "Create Account";

            return;

          }


          /* SUCCESS */

          showMessage(
            "Account created successfully.",
            "success"
          );


          /*
           * If Supabase returned a session,
           * the user can enter the app immediately.
           */

          if (result.session) {

            button.textContent =
              "Opening Coach Bolbol...";


            setTimeout(
              function() {

                window.location.replace(
                  "dashboard.html"
                );

              },
              700
            );

            return;

          }


          /*
           * Email confirmation is enabled.
           * Supabase will not create an active
           * session until the email is confirmed.
           */

          button.disabled = false;

          button.textContent =
            "Create Account";


          showMessage(
            "Account created. Check your email and confirm your account before logging in.",
            "success"
          );


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );


          showMessage(
            error?.message ||
            "Something went wrong while creating your account.",
            "error"
          );


          button.disabled = false;

          button.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>

            </html>
