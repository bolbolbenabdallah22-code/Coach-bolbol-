<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f7f9fc"
  >

  <title>Coach Bolbol — Create Account</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f9fc;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,.08);
      animation: authEnter .45s ease;
    }

    @keyframes authEnter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
    }

    .auth-brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .auth-brand p {
      margin: 8px 0 0;
      color: #6b7280;
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    .auth-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #dfe3ea;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .auth-field input:focus {
      border-color: #111827;
    }

    .password-hint {
      margin-top: 6px;
      color: #6b7280;
      font-size: 12px;
    }

    .auth-button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .auth-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      background: #fff1f2;
      color: #be123c;
    }

    .auth-message.success {
      background: #ecfdf5;
      color: #047857;
    }

    .auth-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .auth-links a {
      color: #111827;
      font-weight: 800;
      text-decoration: none;
    }

  </style>

</head>


<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-brand">

        <div class="auth-logo">
          CB
        </div>

        <h1>Coach Bolbol</h1>

        <p>
          Create your fitness account.
        </p>

      </div>


      <form id="registerForm">


        <div class="auth-field">

          <label for="fullName">
            Full name
          </label>

          <input
            id="fullName"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="auth-field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="auth-field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <div class="password-hint">
            Minimum 6 characters.
          </div>

        </div>


        <div class="auth-field">

          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            id="confirmPassword"
            type="password"
            placeholder="Repeat your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <button
          type="submit"
          class="auth-button"
          id="registerButton"
        >
          Create Account
        </button>


      </form>


      <div
        id="authMessage"
        class="auth-message"
      ></div>


      <div class="auth-links">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>


    </section>

  </main>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- COACH BOLBOL -->

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="auth.js"></script>


  <script>

    const form =
      document.getElementById("registerForm");

    const nameInput =
      document.getElementById("fullName");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmInput =
      document.getElementById("confirmPassword");

    const button =
      document.getElementById("registerButton");

    const message =
      document.getElementById("authMessage");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "auth-message show " + type;

    }


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const fullName =
          nameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmInput.value;


        if (!fullName) {

          showMessage(
            "Please enter your name.",
            "error"
          );

          return;

        }


        if (!email) {

          showMessage(
            "Please enter your email.",
            "error"
          );

          return;

        }


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;

        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        button.disabled = true;

        button.textContent =
          "Creating account...";


        const result =
          await window.CoachBolbolAuth.signUp(
            email,
            password,
            fullName
          );


        if (!result.success) {

          showMessage(
            result.error ||
            "Account creation failed.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Create Account";

          return;

        }


        showMessage(
          "Account created successfully.",
          "success"
        );


        /*
         * Supabase may require email confirmation.
         * If a session exists, open dashboard.
         * Otherwise ask the user to check email.
         */

        if (result.session) {

          setTimeout(function () {

            window.location.href =
              "dashboard.html";

          }, 800);

        } else {

          button.disabled = false;

          button.textContent =
            "Create Account";

          showMessage(
            "Account created. Please check your email to confirm your account.",
            "success"
          );

        }

      }
    );

  </script>

</body>

  </html>
