<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Messages | Coach Bolbol</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .messages-layout {
      display: grid;
      gap: 16px;
    }

    .message-info-card {
      background: var(--card-bg, #fff);
      border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 18px;
      padding: 18px;
    }

    .message-info-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .message-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--primary-color, #111827);
      color: #fff;
      font-weight: 800;
      flex-shrink: 0;
    }

    .message-info-card h2 {
      margin: 0;
      font-size: 17px;
    }

    .message-info-card p {
      margin: 4px 0 0;
      color: var(--muted-color, #6b7280);
      font-size: 13px;
    }

    .conversation-card {
      background: var(--card-bg, #fff);
      border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 18px;
      overflow: hidden;
    }

    .conversation-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color, #e5e7eb);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .conversation-header strong {
      font-size: 15px;
    }

    .connection-status {
      font-size: 11px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #6b7280;
    }

    .connection-status.online {
      background: #ecfdf5;
      color: #047857;
    }

    .connection-status.local {
      background: #fff7ed;
      color: #c2410c;
    }

    .messages-list {
      min-height: 260px;
      max-height: 52vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-row {
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 16px;
      background: #f3f4f6;
      color: #111827;
    }

    .message-row.mine .message-bubble {
      background: var(--primary-color, #111827);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .message-row:not(.mine) .message-bubble {
      border-bottom-left-radius: 5px;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .message-time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      opacity: .65;
      text-align: right;
    }

    .message-compose {
      padding: 14px;
      border-top: 1px solid var(--border-color, #e5e7eb);
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }

    .message-compose textarea {
      flex: 1;
      min-height: 46px;
      max-height: 120px;
      resize: vertical;
      margin: 0;
    }

    .send-message-btn {
      min-width: 48px;
      width: 48px;
      height: 46px;
      padding: 0;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .unread-badge {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
    }

    .message-empty {
      min-height: 230px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted-color, #6b7280);
      padding: 30px;
    }

    .message-empty-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .message-actions {
      display: flex;
      gap: 8px;
    }

    .small-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted-color, #6b7280);
    }

    @media (max-width: 420px) {
      .message-bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-inner">

      <button
        class="icon-button"
        type="button"
        onclick="goBack()"
        aria-label="Go back"
      >
        ←
      </button>

      <div class="header-title">
        <strong>Messages</strong>
        <span>Coach communication</span>
      </div>

      <button
        class="icon-button"
        type="button"
        onclick="goTo('notifications.html')"
        aria-label="Notifications"
      >
        🔔
      </button>

    </div>
  </header>


  <!-- MAIN -->
  <main class="page-container">

    <section class="page-section">

      <div class="page-heading">

        <div>
          <span class="eyebrow">COACH SUPPORT</span>

          <h1>Message Coach</h1>

          <p>
            Send questions, updates and progress information directly to your coach.
          </p>
        </div>

      </div>

    </section>


    <section class="page-section">

      <div class="messages-layout">

        <!-- COACH INFO -->
        <div class="message-info-card">

          <div class="message-info-top">

            <div class="message-avatar">
              CB
            </div>

            <div>
              <h2>Coach Bolbol</h2>
              <p>Fitness & Nutrition Coach</p>
            </div>

          </div>

        </div>


        <!-- CONVERSATION -->
        <div class="conversation-card">

          <div class="conversation-header">

            <strong>
              Private Conversation
            </strong>

            <div class="message-actions">

              <span
                class="unread-badge"
                id="unreadBadge"
                style="display:none;"
              >
                0
              </span>

              <span
                class="connection-status local"
                id="connectionStatus"
              >
                Local
              </span>

            </div>

          </div>


          <div
            class="messages-list"
            id="messagesList"
          ></div>


          <!-- COMPOSER -->
          <form
            class="message-compose"
            id="messageForm"
          >

            <textarea
              id="messageInput"
              placeholder="Write a message..."
              maxlength="2000"
              required
            ></textarea>

            <button
              class="btn send-message-btn"
              type="submit"
              id="sendMessageBtn"
              aria-label="Send message"
            >
              ➤
            </button>

          </form>

        </div>


        <button
          class="btn btn-secondary btn-block"
          type="button"
          id="markReadBtn"
        >
          Mark messages as read
        </button>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="dashboard.html" data-page="dashboard">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a href="programs.html" data-page="programs">
      <span>🏋️</span>
      <small>Programs</small>
    </a>

    <a href="workout.html" data-page="workout">
      <span>▶</span>
      <small>Workout</small>
    </a>

    <a href="progress.html" data-page="progress">
      <span>📈</span>
      <small>Progress</small>
    </a>

    <a href="profile.html" data-page="profile">
      <span>👤</span>
      <small>Profile</small>
    </a>

  </nav>


  <!-- SCRIPTS -->
  <script src="app.js"></script>
  <script src="storage.js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="messages.js"></script>
  <script src="ui.js"></script>


  <script>
    let currentUserId = null;


    function safeEscape(value) {

      if (
        window.CoachBolbolUI &&
        typeof window.CoachBolbolUI.escapeHTML === "function"
      ) {
        return window.CoachBolbolUI.escapeHTML(
          String(value ?? "")
        );
      }

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function getMessageSenderId(message) {

      return (
        message.sender_id ||
        message.senderId ||
        message.from ||
        message.user_id ||
        message.userId ||
        ""
      );
    }


    function getMessageText(message) {

      return (
        message.content ||
        message.message ||
        message.text ||
        ""
      );
    }


    function getMessageDate(message) {

      return (
        message.created_at ||
        message.createdAt ||
        message.date ||
        message.timestamp ||
        ""
      );
    }


    function formatMessageTime(value) {

      if (!value) {
        return "";
      }

      try {

        return new Date(value).toLocaleString(
          "en-US",
          {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      } catch (error) {
        return "";
      }
    }


    async function getUserId() {

      try {

        if (
          window.CoachBolbolAuth &&
          typeof window.CoachBolbolAuth.getCurrentUser === "function"
        ) {

          const user =
            await window.CoachBolbolAuth.getCurrentUser();

          if (user?.id) {
            return user.id;
          }

        }

      } catch (error) {
        console.warn(error);
      }

      return (
        localStorage.getItem("coach_bolbol_user_id") ||
        "local-user"
      );
    }


    function getCoachId() {

      return (
        window.COACH_BOLBOL_CONFIG?.coachId ||
        localStorage.getItem("coach_bolbol_coach_id") ||
        ""
      );
    }


    function localMessages() {

      try {

        const raw =
          localStorage.getItem(
            "coach_bolbol_messages"
          );

        if (!raw) {
          return [];
        }

        const data =
          JSON.parse(raw);

        return Array.isArray(data)
          ? data
          : [];

      } catch (error) {
        return [];
      }
    }


    async function loadMessages() {

      const list =
        document.getElementById("messagesList");

      list.innerHTML = `
        <div class="message-empty">
          <div>
            <div class="message-empty-icon">⏳</div>
            <strong>Loading messages...</strong>
          </div>
        </div>
      `;


      currentUserId =
        await getUserId();


      let messages = [];


      try {

        if (
          window.CoachBolbolMessages &&
          typeof window.CoachBolbolMessages.getConversation === "function"
        ) {

          messages =
            await window.CoachBolbolMessages.getConversation(
              getCoachId()
            );

        }

      } catch (error) {

        console.warn(
          "Cloud messages unavailable:",
          error
        );

      }


      if (!Array.isArray(messages) || !messages.length) {

        const local =
          localMessages();

        messages =
          local.filter((message) => {

            const sender =
              getMessageSenderId(message);

            const receiver =
              message.receiver_id ||
              message.receiverId ||
              message.to ||
              "";

            const coachId =
              getCoachId();

            if (!coachId) {
              return true;
            }

            return (
              (sender === currentUserId &&
                receiver === coachId) ||
              (sender === coachId &&
                receiver === currentUserId)
            );

          });

      }


      renderMessages(messages);

      await updateUnread();

      updateConnectionStatus();

    }


    function renderMessages(messages) {

      const list =
        document.getElementById("messagesList");


      if (!messages.length) {

        list.innerHTML = `
          <div class="message-empty">

            <div>

              <div class="message-empty-icon">
                💬
              </div>

              <strong>
                No messages yet
              </strong>

              <p>
                Start the conversation with Coach Bolbol.
              </p>

            </div>

          </div>
        `;

        return;
      }


      messages.sort((a, b) => {

        const dateA =
          new Date(
            getMessageDate(a) || 0
          ).getTime();

        const dateB =
          new Date(
            getMessageDate(b) || 0
          ).getTime();

        return dateA - dateB;

      });


      list.innerHTML =
        messages
          .map((message) => {

            const sender =
              getMessageSenderId(message);

            const mine =
              sender === currentUserId;

            return `
              <div class="message-row ${mine ? "mine" : ""}">

                <div class="message-bubble">

                  <p class="message-text">
                    ${safeEscape(
                      getMessageText(message)
                    )}
                  </p>

                  <span class="message-time">
                    ${safeEscape(
                      formatMessageTime(
                        getMessageDate(message)
                      )
                    )}
                  </span>

                </div>

              </div>
            `;

          })
          .join("");


      requestAnimationFrame(() => {

        list.scrollTop =
          list.scrollHeight;

      });

    }


    async function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const button =
        document.getElementById("sendMessageBtn");

      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      const coachId =
        getCoachId();


      if (!coachId) {

        alert(
          "Coach account is not connected yet. Please add the coach ID in config.js."
        );

        return;
      }


      button.disabled = true;


      try {

        let result = null;


        if (
          window.CoachBolbolMessages &&
          typeof window.CoachBolbolMessages.sendMessage === "function"
        ) {

          result =
            await window.CoachBolbolMessages.sendMessage(
              coachId,
              text
            );

        }


        if (!result) {

          const messages =
            localMessages();

          messages.push({

            id:
              "local-" +
              Date.now(),

            sender_id:
              currentUserId,

            receiver_id:
              coachId,

            content:
              text,

            created_at:
              new Date().toISOString(),

            read:
              false

          });


          localStorage.setItem(
            "coach_bolbol_messages",
            JSON.stringify(messages)
          );

        }


        input.value = "";

        await loadMessages();


        if (
          window.CoachBolbolUI &&
          typeof window.CoachBolbolUI.toast === "function"
        ) {

          window.CoachBolbolUI.toast(
            "Message sent."
          );

        } else if (
          typeof showToast === "function"
        ) {

          showToast(
            "Message sent."
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          error?.message ||
          "Could not send the message."
        );

      } finally {

        button.disabled = false;

      }

    }


    async function updateUnread() {

      const badge =
        document.getElementById("unreadBadge");


      try {

        let count = 0;


        if (
          window.CoachBolbolMessages &&
          typeof window.CoachBolbolMessages.getUnreadCount === "function"
        ) {

          count =
            await window.CoachBolbolMessages.getUnreadCount();

        }


        count =
          Number(count) || 0;


        if (count > 0) {

          badge.style.display =
            "inline-grid";

          badge.textContent =
            count > 99
              ? "99+"
              : count;

        } else {

          badge.style.display =
            "none";

        }

      } catch (error) {

        badge.style.display =
          "none";

      }

    }


    async function markRead() {

      try {

        if (
          window.CoachBolbolMessages &&
          typeof window.CoachBolbolMessages.markConversationRead === "function"
        ) {

          await window.CoachBolbolMessages.markConversationRead(
            getCoachId()
          );

        }

      } catch (error) {

        console.warn(error);

      }


      await updateUnread();


      if (
        window.CoachBolbolUI &&
        typeof window.CoachBolbolUI.toast === "function"
      ) {

        window.CoachBolbolUI.toast(
          "Messages marked as read."
        );

      }

    }


    function updateConnectionStatus() {

      const status =
        document.getElementById(
          "connectionStatus"
        );


      const configured =
        Boolean(
          window.COACH_BOLBOL_CONFIG?.supabaseUrl &&
          window.COACH_BOLBOL_CONFIG?.supabaseAnonKey
        );


      if (configured) {

        status.textContent =
          "Cloud";

        status.classList.remove(
          "local"
        );

        status.classList.add(
          "online"
        );

      } else {

        status.textContent =
          "Local";

        status.classList.remove(
          "online"
        );

        status.classList.add(
          "local"
        );

      }

    }


    document.addEventListener(
      "DOMContentLoaded",
      () => {

        document
          .getElementById("messageForm")
          .addEventListener(
            "submit",
            (event) => {

              event.preventDefault();

              sendMessage();

            }
          );


        document
          .getElementById("markReadBtn")
          .addEventListener(
            "click",
            markRead
          );


        document
          .getElementById("messageInput")
          .addEventListener(
            "keydown",
            (event) => {

              if (
                event.key === "Enter" &&
                !event.shiftKey
              ) {

                event.preventDefault();

                document
                  .getElementById("messageForm")
                  .requestSubmit();

              }

            }
          );


        loadMessages();

      }
    );
  </script>

</body>
  </html>
